<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스쿼드 메이커</title>
<meta name="theme-color" content="#17663a">
<meta name="description" content="동네축구·풋살 라인업 짜기와 경기 기록">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스쿼드 메이커">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ea; --card:#ffffff; --ink:#1c1e1b; --muted:#6c7069; --line:#e3e0d6;
  --accent:#17663a; --accent-soft:#e3efe6; --sel:#ffd84d; --chip:#f1efe8; --danger:#d93d42;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

.app{max-width:1120px;margin:0 auto;padding:18px 16px 48px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand h1{font-size:19px;font-weight:900;margin:0;letter-spacing:-.02em}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}

.nav{display:flex;gap:4px;background:#e7e4da;border-radius:12px;padding:4px;margin-bottom:14px}
.nav button{flex:1;padding:10px 6px;border-radius:9px;font-weight:700;font-size:15px;color:var(--muted)}
.nav button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.banner{background:#fff6d6;border:1px solid #f0dc8a;color:#5c4a00;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:880px){.layout{grid-template-columns:minmax(0,1fr) 350px;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}

/* groups and attendance */
.group-page{max-width:620px;margin:24px auto 0}
.page-heading{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.page-heading h2{font-size:22px;margin:0;overflow-wrap:anywhere}
.group-list{display:grid;gap:8px}
.group-card{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px}
.group-open{flex:1 1 165px;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:10px 12px;border-radius:9px}
.group-open:hover{background:var(--accent-soft)}
.group-open b{overflow-wrap:anywhere}
.group-open small{color:var(--muted);white-space:nowrap}
.group-resume{margin:0 4px 0 auto}
.group-context{margin-bottom:8px;color:var(--accent);font-size:13px;font-weight:700;overflow-wrap:anywhere}
.attendance-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.member-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.member-choice{display:flex;align-items:center;gap:8px;padding:9px;min-height:44px;border:1px solid var(--line);border-radius:9px;cursor:pointer;overflow-wrap:anywhere}
.member-choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.member-choice input{margin:0;accent-color:var(--accent);width:18px;height:18px;flex:none}
.attendance-add{margin-top:12px}
.attendance-add summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--accent);padding:7px 0}
.attendance-add .add-row{margin-top:6px}
.attendance-add textarea{min-width:0;height:60px}
.attendance-actions{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;background:var(--bg);padding:12px 0}
.attendance-actions label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700}
#applyAttendance{margin-left:auto}

/* lineup controls */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{flex:1 1 22%;min-width:0;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;background:#ebe8df;font-weight:700;font-size:15px}
.tab.on{background:var(--ink);color:#fff}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.tab .cnt{font-weight:500;font-size:12px;opacity:.7}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.ctrl-row label{font-size:12px;color:var(--muted);font-weight:500}
select{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff;font-weight:700}
.iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;background:#fff}
.grp{display:flex;align-items:center;gap:6px}
.size-now{font-weight:900;font-size:15px}
.mini-btn{padding:5px 10px;border-radius:8px;background:#ebe8df;font-size:12px;font-weight:700}

/* pitch */
.pitch-outer{display:flex;justify-content:center;align-items:flex-start;gap:14px}
.pitch-wrap{width:100%}
.side-col{flex:none;width:96px;display:flex;flex-direction:column;gap:8px}
.ref-box{display:block;background:#1c1e1b;border-radius:12px;padding:8px 7px;color:#fff}
.ref-h{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:900;margin-bottom:6px;flex-wrap:wrap}
.ref-h small{font-size:9.5px;font-weight:500;opacity:.6;width:100%}
.whistle{width:18px;height:18px;border-radius:50%;background:#ffd84d;color:#1c1e1b;display:grid;place-items:center;font-size:10px;font-weight:900}
.ref-box input{width:100%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:7px;padding:5px 7px;font-size:13px;font-weight:700}
.ref-box input::placeholder{color:rgba(255,255,255,.45)}
.subs{background:#1f2a22;border-radius:12px;padding:8px 6px;color:#fff}
.subs-h{font-size:12px;font-weight:900;letter-spacing:.04em;opacity:.8;margin:0 2px 8px;display:flex;align-items:center;gap:6px}
.subs-list{display:flex;flex-direction:column;gap:5px}
.sbs{display:flex;align-items:center;padding:5px 6px 5px 8px;border-radius:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);box-shadow:inset 3px 0 0 var(--tc);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;min-height:30px}
.sbs .tag{display:none}
.sbs .sn{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sbs.empty{border-style:dashed;justify-content:center;color:rgba(255,255,255,.65);font-size:11.5px;font-weight:700;cursor:pointer;background:none;box-shadow:none;padding-left:6px}
.sbs.sel{outline:3px solid var(--sel);outline-offset:1px}
.sbs.over{outline:3px solid var(--sel);outline-offset:1px;background:rgba(255,255,255,.18)}
.sbs.dragging{opacity:.35}
@media (max-width:879px){.pitch-outer{flex-direction:column;align-items:stretch}.side-col{width:100%}.ref-box{display:flex;align-items:center;gap:8px}.ref-h{margin:0;flex-wrap:nowrap;white-space:nowrap}.ref-h small{width:auto}.ref-box input{flex:1}.subs-list{flex-direction:row;flex-wrap:wrap}.sbs{flex:1 1 30%;max-width:calc(34% - 4px)}}
.team-roster{display:block;width:100%;text-align:left;margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid transparent}
.team-roster:hover{background:#faf9f5;border-color:var(--line)}
.team-roster.cur{background:#f4f8f5;border-color:#cfe3d5}
.team-roster h2{margin:0 0 4px}
.team-roster .go{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
@media (min-width:880px){.pitch-wrap{width:min(100%, calc((100vh - 300px) * 68 / 105));min-width:340px}}
.pitch{position:relative;width:100%;aspect-ratio:68/105;border-radius:12px;overflow:hidden;
  background:repeating-linear-gradient(180deg,#2f8f4e 0 8.33%,#2a8447 8.33% 16.66%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);touch-action:none;user-select:none;-webkit-user-select:none}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pitch-tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.35);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;pointer-events:none}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:grab;touch-action:none;z-index:2}
.disc{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:900;letter-spacing:-.01em;
  border:3px solid var(--pc);color:var(--pc);background:rgba(10,20,14,.55);box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .12s,border-color .15s}
.slot:not(.filled) .disc{border-style:dashed;background:rgba(10,20,14,.35)}
.slot.filled .disc{box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 2px 8px rgba(0,0,0,.35)}
.slot.filled .nm{box-shadow:inset 0 -3px 0 var(--tc)}
.team-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.team-btns .btn{font-size:13px;padding:9px 8px}
#delTeam{color:var(--danger)}
.other-team{display:block;width:100%;text-align:left;margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid transparent}
.other-team:hover{background:#faf9f5;border-color:var(--line)}
.other-team h2{margin:0 0 4px}
.other-team .go{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.ref-in{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.ref-in input{width:130px}
.legend{display:flex;gap:12px;justify-content:center;margin-top:8px;font-size:12px;font-weight:700;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:50%;border:3px solid;display:inline-block}
.ghost .gp{display:inline-block;margin-left:8px;padding:0 7px;border-radius:999px;font-size:12px;color:#1c1e1b}
.gb{position:absolute;right:-7px;top:-6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#fff;color:#1c1e1b;font-size:10px;font-weight:900;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.nm{max-width:84px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot:not(.filled) .nm{display:none}
.slot.sel .disc{outline:3px solid var(--sel);outline-offset:2px;transform:scale(1.08)}
.slot.over .disc{outline:3px solid var(--sel);outline-offset:2px;transform:scale(1.15)}
.slot.dragging{opacity:.35}
@media (max-width:420px){.disc{width:34px;height:34px;font-size:9.5px;border-width:2.5px}.nm{font-size:11px;max-width:70px;padding:1px 5px}}
.hint{margin-top:10px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:34px}
.hint b{color:var(--ink)}
.hint .mini{padding:5px 10px;border-radius:8px;background:#ebe8df;font-size:12px;font-weight:700;color:var(--ink)}
.img-btn{width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;font-size:15px}
.img-prev{width:100%;max-height:60vh;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#f7f6f1;display:block;margin-bottom:10px;-webkit-touch-callout:default;user-select:auto}
.start-match{width:100%;margin-top:10px;padding:13px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}

/* side */
.side{display:flex;flex-direction:column;gap:14px}
h2{font-size:14px;margin:0 0 10px;font-weight:900;display:flex;align-items:center;gap:6px}
.pill{font-size:11px;background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:999px;font-weight:700}
.pill.live{background:#ffe9e9;color:var(--danger)}
.add-row{display:flex;gap:6px}
.add-row textarea{flex:1;resize:none;height:42px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fbfaf7}
.btn{padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px;background:#ebe8df}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#125530}
.btn.danger{background:var(--danger);color:#fff}
.btn.outline{background:none;border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.sub{font-size:12px;color:var(--muted);margin:6px 0 0}
.shot-btn{width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;border:1.5px dashed #c9c4b4;background:#fbfaf7;font-weight:700;font-size:14px;color:var(--ink)}
.shot-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.shot-btn .kk{width:20px;height:20px;border-radius:6px;background:#fee500;display:grid;place-items:center;font-size:11px;font-weight:900;color:#3a1d1d}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:6px auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.pick.exist::after{content:' · 기존';font-size:11px;opacity:.7}
.pick:disabled{opacity:.4;cursor:not-allowed}
.opt-cnt{font-size:11px;opacity:.75;margin-left:3px}

#bench{min-height:64px;border:2px dashed transparent;border-radius:10px;padding:4px;margin:-4px;transition:border-color .12s,background .12s}
#bench.over{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:4px;padding:6px 4px 6px 11px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:14px;font-weight:500;cursor:grab;user-select:none;-webkit-user-select:none}
.chip.sel{background:var(--sel);border-color:#e0b800}
.chip.dragging{opacity:.35}
.chip .x{width:22px;height:22px;border-radius:50%;color:var(--muted);font-size:15px;line-height:1;display:grid;place-items:center}
.chip .x:hover{background:rgba(0,0,0,.08);color:var(--ink)}
.chip.taken{opacity:.5;cursor:not-allowed;background:#fff;border-style:dashed;padding-right:10px}
.chip.taken .tk{font-size:11px;font-weight:700;color:var(--muted)}
.chip.add{cursor:pointer;padding:5px 11px;font-size:13px;background:#fff;border-style:dashed}
.chip.add:hover{background:var(--accent-soft);border-color:var(--accent)}
.cg{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:0 6px 0 4px;height:18px}
.ball{width:11px;height:11px}
.empty{color:var(--muted);font-size:13px;margin:8px 2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.actions .btn{font-size:13px;padding:9px 8px}
.other-list{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.other-list b{color:var(--ink);font-weight:500}
.team-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.name-in{flex:1;min-width:120px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-weight:700;background:#fbfaf7}
.swatches{display:flex;gap:5px}
.sw{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}

/* matches */
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.list-head h2{margin:0;font-size:17px}
.mlist{display:grid;gap:10px}
@media (min-width:760px){.mlist{grid-template-columns:1fr 1fr}}
.mcard{text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mcard:hover{border-color:#cfcabb}
.mc-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.mc-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.mc-team{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;min-width:0}
.mc-team span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-team.r{justify-content:flex-end}
.mc-num{font-size:24px;font-weight:900;letter-spacing:.02em}
.mc-scorers{font-size:12px;color:var(--muted);margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc-scorers div:last-child{text-align:right}
.big-empty{text-align:center;padding:40px 20px;color:var(--muted)}

.md-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.back{padding:8px 12px;border-radius:9px;background:#e7e4da;font-weight:700;font-size:14px}
.md-head input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;font-weight:500}
.md-head input[type=text]{flex:1;min-width:160px}
.md-grid{display:grid;gap:14px}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:18px 12px}
.sb-team{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.sb-name{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;max-width:100%}
.sb-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-score{font-size:60px;font-weight:900;line-height:1;letter-spacing:-.03em}
.sb-mid{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:30px;font-weight:900;color:#c5c1b4}
.sb-team .btn{padding:9px 16px}
.goal-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);font-size:14px}
.goal-row:first-child{border-top:0}
.goal-row .gs{font-weight:900;font-size:13px;color:var(--muted);min-width:34px}
.goal-row .who{flex:1;min-width:0}
.goal-row .who small{color:var(--muted);margin-left:6px}
.goal-row .x{width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:17px}
.goal-row .x:hover{background:#f1efe8}
.squads{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.squads h3{font-size:13px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.squads .chip{cursor:default;font-size:13px;padding:4px 3px 4px 9px}
.md-actions{display:flex;gap:8px;flex-wrap:wrap}

/* stats */
.stat-sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat-sum div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:100px}
.stat-sum b{display:block;font-size:22px;font-weight:900}
.stat-sum span{font-size:12px;color:var(--muted);font-weight:700}
.segs{display:inline-flex;background:#e7e4da;border-radius:9px;padding:3px;margin-bottom:10px}
.seg{padding:5px 12px;border-radius:7px;font-size:13px;font-weight:700;color:var(--muted)}
.seg.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.stbl{width:100%;border-collapse:collapse;font-size:14px}
.stbl th{font-size:12px;color:var(--muted);font-weight:700;text-align:center;padding:9px 6px;background:#faf9f5;border-bottom:1px solid var(--line)}
.stbl td{text-align:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.stbl th:nth-child(2),.stbl td:nth-child(2){text-align:left}
.stbl tr.row{cursor:pointer}
.stbl tr.row:hover td{background:#faf9f5}
.stbl tr.row.open td{background:#f4f8f5}

.hist{display:grid;gap:4px;margin:6px 0 10px}
.hist div{display:flex;gap:8px;font-size:13px;align-items:center}
.res{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;flex:none}
.res.W{background:#1f9d55}.res.D{background:#9a968a}.res.L{background:#d93d42}

/* misc */
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;transform:translate(-50%,-50%);padding:6px 12px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(20,22,20,.45);display:grid;place-items:center;z-index:70;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.modal p{margin:0 0 14px;color:var(--muted);font-size:14px}
.modal textarea{width:100%;height:220px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.m-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.pick-label{font-size:12px;font-weight:700;color:var(--muted);margin:4px 0 6px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pick{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fbfaf7;font-size:14px;font-weight:500}
.pick.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pick.alt{color:var(--muted);border-style:dashed}

.loading{position:fixed;inset:0;z-index:66;background:var(--bg);display:grid;place-items:center;padding:20px;color:var(--muted);font-weight:700}
.foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
</style>

<script>
(function(){
/* ================= constants & helpers ================= */
const MIN=3,MAX=11;
const FORMATIONS={
  3:['1-1','2'], 4:['2-1','1-2','1-1-1'], 5:['2-2','1-2-1','3-1','2-1-1'],
  6:['2-2-1','3-1-1','2-1-2','1-2-2'], 7:['3-2-1','2-3-1','3-1-2','2-1-2-1'],
  8:['3-3-1','3-2-2','2-3-2','3-1-3'], 9:['3-3-2','4-3-1','3-4-1','3-2-3'],
  10:['4-3-2','3-4-2','4-4-1','3-3-3'], 11:['4-4-2','4-3-3','4-2-3-1','4-1-4-1','3-5-2','3-4-3','5-3-2']
};
const COLORS=['#e5484d','#3e63dd','#f5a524','#1f9d55','#8e4ec6','#1c1e1b','#12a594','#d6409f'];
const LKEY='squadmaker.v2';
const LEGACY_GROUP='legacy';
const BALL='<svg class="ball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5l3.8 2.7-1.4 4.4H9.6l-1.4-4.4z" fill="currentColor"/></svg>';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clone=o=>JSON.parse(JSON.stringify(o));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function textOn(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>160?'#1c1e1b':'#fff'}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(ymd){if(!ymd)return '';const d=new Date(ymd+'T00:00:00');if(isNaN(d))return ymd;return `${d.getMonth()+1}/${d.getDate()} (${'일월화수목금토'[d.getDay()]})`}

const POSCOL={GK:'#ffc531',DF:'#3d8bff',MF:'#2ecc71',FW:'#ff4d4f'};
function posOf(s){
  const x=s.x,y=s.y;const side=(l,c,r,lt=42,rt=58)=>x<lt?l:x>rt?r:c;
  if(y>=84) return {code:'GK',cat:'GK'};
  if(y>=77&&x>=36&&x<=64) return {code:'SW',cat:'DF'};
  if(y>=62){if(x<22)return {code:'LB',cat:'DF'};if(x>78)return {code:'RB',cat:'DF'};return {code:side('LCB','CB','RCB'),cat:'DF'}}
  if(y>=52){if(x<22)return {code:'LWB',cat:'DF'};if(x>78)return {code:'RWB',cat:'DF'};return {code:side('LDM','CDM','RDM'),cat:'MF'}}
  if(y>=36){if(x<22)return {code:'LM',cat:'MF'};if(x>78)return {code:'RM',cat:'MF'};return {code:side('LCM','CM','RCM'),cat:'MF'}}
  if(y>=27){if(x<22)return {code:'LM',cat:'MF'};if(x>78)return {code:'RM',cat:'MF'};return {code:side('LAM','CAM','RAM'),cat:'MF'}}
  if(y>=18){if(x<30)return {code:'LW',cat:'FW'};if(x>70)return {code:'RW',cat:'FW'};return {code:side('LF','CF','RF'),cat:'FW'}}
  if(x<30)return {code:'LW',cat:'FW'};if(x>70)return {code:'RW',cat:'FW'};return {code:side('LS','ST','RS',44,56),cat:'FW'};
}
function buildSlots(f){
  const lines=f.split('-').map(Number),L=lines.length;
  const slots=[{x:50,y:90,label:'GK',pid:null}];
  const bottom=72, top=L===1?45:14;
  lines.forEach((n,li)=>{
    const y=L===1?top:bottom-li*(bottom-top)/(L-1);
    const label=li===0?'DF':(li===L-1?'FW':'MF');
    for(let i=0;i<n;i++) slots.push({x:(i+1)/(n+1)*100,y,label,pid:null});
  });
  return slots;
}
function newTeam(name,color,size){const f=FORMATIONS[size][0];return {name,color,formation:f,slots:buildSlots(f)}}
const TK=['A','B','C','D','E','F','G','H'];const MAXT=8;
function freshCurrent(){return {v:2,started:false,size:11,title:'',active:'A',teamCount:2,attendees:[],referee:'',teams:{A:newTeam('A팀',COLORS[0],11),B:newTeam('B팀',COLORS[1],11)}}}

/* ================= data ================= */
let roster={};    // pid -> {name, createdAt, groupId}
let matches={};   // id -> match
let groups={};    // group ID -> current lineup and group title
let groupId=null;
let cur=freshCurrent();
let DB=null, mode='pending', readOnly=false, loaded=false, dbCurrentLoaded=false;
let view='groups', openMatch=null, statSort='g', openStat=null;
let sel=null;

/* ---- persistence ---- */
function currentData(){return {v:3,groups}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({roster,matches,cur:currentData()}))}catch(e){}}
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LKEY));if(s){roster=s.roster||{};matches=s.matches||{};restoreGroups(s.cur)}}catch(e){}}
const pend=new Set(), W={}, timers={};
function canWrite(){return !readOnly&&(mode!=='db'||dbCurrentLoaded)}
function enqueue(path,job){
  if(!canWrite()) return;
  pend.add(path);const w=W[path]||(W[path]={busy:false,next:null});w.next=job;pump(path);
}
function schedule(path,getData,delay){
  if(!canWrite()) return;
  pend.add(path);clearTimeout(timers[path]);
  timers[path]=setTimeout(()=>{delete timers[path];enqueue(path,{op:'set',get:getData})},delay);
}
async function pump(path){
  const w=W[path];if(w.busy) return;
  if(!w.next){if(!timers[path])pend.delete(path);return}
  const job=w.next;w.next=null;w.busy=true;
  try{
    const ref=DB.doc(path);
    if(job.op==='set'){const d=job.get();if(d) await ref.set(clone(d)); else await ref.delete();}
    else await ref.delete();
  }catch(e){onWriteErr(e)}
  w.busy=false;pump(path);
}
let errShown=false;
function onWriteErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'||c==='not_granted'||c==='revoked'){readOnly=true;showBanner();if(!errShown){toast('편집 권한이 없어서 저장되지 않았어요');errShown=true}}
  else if(c==='quota_exceeded') toast('저장 공간이 가득 찼어요. 오래된 경기를 지워 주세요');
  else toast('저장에 실패했어요. 잠시 후 다시 시도해 주세요');
}
function putCurrent(){if(mode==='db')schedule('app/current',currentData,450);else saveLocal()}
function putPlayer(pid){if(mode==='db')enqueue('players/'+pid,{op:'set',get:()=>roster[pid]});else saveLocal()}
function delPlayerDoc(pid){if(mode==='db')enqueue('players/'+pid,{op:'del'});else saveLocal()}
function putMatch(id,delay){if(mode==='db'){if(delay)schedule('matches/'+id,()=>matches[id],delay);else enqueue('matches/'+id,{op:'set',get:()=>matches[id]})}else saveLocal()}
function delMatchDoc(id){if(mode==='db'){clearTimeout(timers['matches/'+id]);delete timers['matches/'+id];enqueue('matches/'+id,{op:'del'})}else saveLocal()}
function commit(){putCurrent();renderAll()}

/* ================= derived ================= */
const T=()=>cur.teams[cur.active];
const keys=(current=cur)=>TK.slice(0,current.teamCount||2);
function ensureTeams(current=cur){
  keys(current).forEach((k,i)=>{
    const t=current.teams[k]||(current.teams[k]=newTeam(k+'팀',COLORS[i],current.size));
    t.color=COLORS[i];
    if(/^[A-H]팀$/.test(t.name))t.name=k+'팀';
    if(!Array.isArray(t.subs))t.subs=[];
    if(!Array.isArray(t.slots))t.slots=buildSlots(FORMATIONS[current.size][0]);
    if(t.slots.length!==current.size)remap(t,FORMATIONS[current.size][0]);
  });
  if(!keys(current).includes(current.active))current.active='A';
}
const pname=id=>roster[id]?roster[id].name:'(삭제됨)';
const groupOf=record=>record.groupId||LEGACY_GROUP;
function groupPlayers(id=groupId){return Object.keys(roster).filter(pid=>groupOf(roster[pid])===id)}
function playersByName(){return new Map(groupPlayers().map(pid=>[pname(pid),pid]))}
const subsOf=t=>Array.isArray(t.subs)?t.subs:(t.subs=[]);
function assignedIds(){const s=new Set();for(const k of keys()){for(const sl of cur.teams[k].slots)if(sl.pid)s.add(sl.pid);for(const p of subsOf(cur.teams[k]))s.add(p)}return s}
function whereIs(pid){for(const k of keys()){const s=cur.teams[k].slots.find(s=>s.pid===pid);if(s)return {k,code:posOf(s).code};if(subsOf(cur.teams[k]).includes(pid))return {k,code:'SUB'}}return null}
function bench(){const a=assignedIds();return cur.attendees.filter(id=>roster[id]&&!a.has(id))}
function score(m,k){return (m.goals||[]).filter(g=>g.team===k).length}
function sortedMatches(){return Object.entries(matches).filter(([,m])=>groupOf(m)===groupId).sort((a,b)=>(b[1].date||'').localeCompare(a[1].date||'')||(b[1].createdAt||0)-(a[1].createdAt||0))}
let STATS={};
function computeStats(){
  const st={};const E=pid=>st[pid]||(st[pid]={apps:0,w:0,d:0,l:0,g:0,a:0,pc:{},hist:[]});
  for(const [id,m] of sortedMatches()){
    const sa=score(m,'A'),sb=score(m,'B');
    const gm={},am={};
    for(const g of m.goals||[]){if(g.scorer&&!g.og)gm[g.scorer]=(gm[g.scorer]||0)+1;if(g.assist)am[g.assist]=(am[g.assist]||0)+1}
    for(const k of ['A','B']){
      const tm=m.teams&&m.teams[k];if(!tm) continue;
      const my=k==='A'?sa:sb,op=k==='A'?sb:sa,res=my>op?'W':my<op?'L':'D';
      for(const pid of tm.players||[]){
        const s=E(pid);s.apps++;s[res.toLowerCase()]++;
        const pc=tm.pos&&tm.pos[pid];if(pc&&pc!=='SUB')s.pc[pc]=(s.pc[pc]||0)+1;
        s.hist.push({id,date:m.date,title:m.title,team:tm.name,res,my,op,g:gm[pid]||0,a:am[pid]||0,pos:pc||null});
      }
    }
    for(const pid in gm)E(pid).g+=gm[pid];
    for(const pid in am)E(pid).a+=am[pid];
  }
  STATS=st;
}
const goalsOf=pid=>STATS[pid]?STATS[pid].g:0;

function scorerSummary(m,k){

  for(const g of m.goals||[]){if(g.team!==k)continue;if(g.og)og++;else if(!g.scorer)unk++;else c[g.scorer]=(c[g.scorer]||0)+1}

  if(og)parts.push('자책골'+(og>1?' '+og:''));if(unk)parts.push('기타'+(unk>1?' '+unk:''));
  return parts.join(', ');
}

/* ---------- stats ---------- */
const PLBL={GK:'골키퍼',DF:'수비',MF:'미드필더',FW:'공격'};
function recPos(s){const e=Object.entries(s.pc||{});if(!e.length)return null;
  const order=['FW','MF','DF','GK'];e.sort((a,b)=>b[1]-a[1]||order.indexOf(a[0])-order.indexOf(b[0]));return e[0][0]}
let selMode=false,selSet=new Set();
function renderStats(){
  const ids=groupPlayers();
  const games=sortedMatches();
  const nm=games.length;
  const tg=games.reduce((a,[,m])=>a+(m.goals||[]).length,0);
  if(!ids.length){selMode=false;$('#sBody').innerHTML='<div class="card big-empty"><b style="color:var(--ink)">아직 선수가 없어요</b><br>라인업 탭에서 참가자를 추가하고 경기를 기록하면 여기에 쌓여요.</div>';return}
  for(const id of [...selSet])if(!roster[id])selSet.delete(id);
  const S=id=>STATS[id]||{apps:0,w:0,d:0,l:0,g:0,a:0,pc:{},hist:[]};
  const key={g:s=>[s.g,s.a,-s.apps],a:s=>[s.a,s.g,-s.apps],apps:s=>[s.apps,s.g,s.a],rate:s=>[s.apps?s.w/s.apps:-1,s.apps,s.g]}[statSort];
  ids.sort((x,y)=>{const sx=S(x),sy=S(y);const px=sx.apps>0,py=sy.apps>0;if(px!==py)return py-px;
    const a=key(sx),b=key(sy);for(let i=0;i<a.length;i++)if(a[i]!==b[i])return b[i]-a[i];return pname(x).localeCompare(pname(y),'ko')});
  const hlcol={g:5,a:6,apps:3,rate:4}[statSort];
  let rank=0,prev=null;
  const rows=ids.map((id,i)=>{const s=S(id);const k=JSON.stringify(key(s));if(k!==prev){rank=i+1;prev=k}
    const rp=recPos(s);
    const cells=[s.apps||'-',s.apps?`${s.w}-${s.d}-${s.l}`:'-',s.g||'-',s.a||'-'];
    const first=selMode?`<td class="rk"><input type="checkbox" class="ck" ${selSet.has(id)?'checked':''} tabindex="-1"></td>`:`<td class="rk">${s.apps?rank:''}</td>`;
    let html=`<tr class="row ${!selMode&&openStat===id?'open':''} ${selMode&&selSet.has(id)?'picked':''}" data-st="${id}">${first}<td class="pn">${esc(pname(id))}</td>
      <td>${rp?`<span class="rp" style="--pc:${POSCOL[rp]}">${PLBL[rp]}</span>`:'<span class="dim">-</span>'}</td>`+
      cells.map((c,ci)=>`<td class="${ci+3===hlcol&&c!=='-'?'hl':''} ${c==='-'?'dim':''}">${c}</td>`).join('')+'</tr>';
    if(!selMode&&openStat===id){
      const rate=s.apps?Math.round(s.w/s.apps*100):0;
      const pcs=['FW','MF','DF','GK'].filter(c=>s.pc&&s.pc[c]).map(c=>`<span class="rp sm" style="--pc:${POSCOL[c]}">${PLBL[c]} ${s.pc[c]}</span>`).join('');
      html+=`<tr class="exp"><td colspan="7">${pcs?`<div class="pc-row"><span class="muted">뛴 포지션</span>${pcs}</div>`:''}<div class="hist">${s.hist.length?s.hist.map(h=>`<div><span class="res ${h.res}">${{W:'승',D:'무',L:'패'}[h.res]}</span>
        <span>${fmtDate(h.date)}</span><span class="muted">${esc(h.team)} ${h.my}:${h.op}</span>${h.pos?`<span class="rp sm" style="--pc:${h.pos==='SUB'?'#9a968a':POSCOL[h.pos]}">${h.pos==='SUB'?'후보':PLBL[h.pos]}</span>`:''}${h.g?`<b>${h.g}골</b>`:''}${h.a?`<span>${h.a}도움</span>`:''}</div>`).join(''):'<div class="muted">아직 출전 기록이 없어요.</div>'}</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="muted" style="font-size:12px;color:var(--muted)">${s.apps?`승률 ${rate}% · 경기당 ${(s.g/s.apps).toFixed(2)}골`:''}</span>
        <span style="flex:1"></span><button class="btn outline" style="font-size:12px;padding:5px 10px" data-rename="${id}">이름 바꾸기</button><button class="btn outline" style="font-size:12px;padding:5px 10px;color:var(--danger)" data-delp="${id}">선수 삭제</button></div></td></tr>`;
    }
    return html}).join('');
  const bar=selMode?`<div class="sel-bar"><b>${selSet.size}명 선택</b><button class="mini-btn" data-sact="all">${selSet.size===ids.length?'전체 해제':'전체 선택'}</button><span style="flex:1"></span>
      <button class="mini-btn" data-sact="cancel">취소</button><button class="btn danger" style="font-size:13px;padding:6px 12px" data-sact="del" ${selSet.size?'':'disabled'}>${selSet.size||''}명 삭제</button></div>`:'';

/* ================= lineup logic ================= */
function remap(team,f){
  const old=team.slots;const gk=old[0]?old[0].pid:null;
  const rest=old.slice(1).map(s=>s.pid).filter(Boolean);
  const ns=buildSlots(f);ns[0].pid=gk;
  for(let i=1;i<ns.length&&rest.length;i++) ns[i].pid=rest.shift();
  team.formation=f;team.slots=ns;
}
function getP(pl){const t=T();return pl.kind==='slot'?t.slots[pl.idx].pid:(subsOf(t)[pl.idx]||null)}
function setP(pl,pid){const t=T();if(pl.kind==='slot'){t.slots[pl.idx].pid=pid;return}
  const sb=subsOf(t);if(pl.idx<sb.length)sb[pl.idx]=pid;else if(pid)sb.push(pid)}
function tidy(){for(const k of keys()){const t=cur.teams[k];t.subs=subsOf(t).filter(Boolean)}}
function removeEverywhere(pid){for(const k of keys()){const t=cur.teams[k];for(const s of t.slots)if(s.pid===pid)s.pid=null;t.subs=subsOf(t).map(p=>p===pid?null:p)}}
function assignTo(pl,pid){removeEverywhere(pid);setP(pl,pid);tidy()}
function assign(pid,idx){assignTo({kind:'slot',idx},pid)}
function swapP(a,b){const pa=getP(a),pb=getP(b);setP(a,pb);setP(b,pa);tidy()}
function unassign(pl){setP(pl,null);tidy()}
const isPlace=x=>x&&(x.kind==='slot'||x.kind==='sub');
const samePlace=(a,b)=>a&&b&&a.kind===b.kind&&a.idx===b.idx;
function tap(src){
  let changed=false;
  if(src.kind==='bench'){
    if(isPlace(sel)){assignTo(sel,src.pid);sel=null;changed=true}
    else if(sel&&sel.kind==='bench'&&sel.pid===src.pid) sel=null;
    else sel=src;
  }else{
    if(sel&&sel.kind==='bench'){assignTo(src,sel.pid);sel=null;changed=true}
    else if(isPlace(sel)){if(!samePlace(sel,src)&&(getP(sel)||getP(src))){swapP(sel,src);changed=true}sel=null}
    else sel=src;
  }
  changed?commit():renderAll();
}

/* drag */
let drag=null;
function startDrag(e,src,el){
  if(e.button>0) return;
  if(e.pointerType==='mouse') e.preventDefault();
  drag={src,el,sx:e.clientX,sy:e.clientY,moved:false,ghost:null,over:null};
  document.addEventListener('pointermove',onMove,{passive:false});
  document.addEventListener('pointerup',onUp);
  document.addEventListener('pointercancel',cleanup);
}
function srcName(src){if(src.kind==='bench')return pname(src.pid);const p=getP(src);if(p)return pname(p);return src.kind==='slot'?posOf(T().slots[src.idx]).code:'후보'}
function targetAt(x,y){
  const el=document.elementFromPoint(x,y);if(!el) return null;
  const sl=el.closest('[data-slot]');if(sl) return {kind:'slot',idx:+sl.dataset.slot,el:sl};
  const sb=el.closest('[data-sub]');if(sb) return {kind:'sub',idx:+sb.dataset.sub,el:sb};
  const sbx=el.closest('#subs');if(sbx) return {kind:'sub',idx:subsOf(T()).length,el:sbx.querySelector('.sbs.empty')};
  const bn=el.closest('#bench');if(bn) return {kind:'bench',el:bn};
  if(el.closest('#pitch')) return {kind:'pitch',el:null};
  return null;
}
function onMove(e){
  if(!drag) return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6) return;
    if(isPlace(drag.src)&&!getP(drag.src)&&drag.src.kind==='sub'){cleanup();return}
    drag.moved=true;
    const g=document.createElement('div');g.className='ghost';g.textContent=srcName(drag.src);document.body.appendChild(g);drag.ghost=g;
    drag.el.classList.add('dragging');
  }
  e.preventDefault();
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  const t=targetAt(e.clientX,e.clientY);
  if(isPlace(drag.src)){
    let html=esc(srcName(drag.src));
    if(drag.src.kind==='slot'&&t&&(t.kind==='pitch'||samePlace(t,drag.src))){
      const r=$('#pitch').getBoundingClientRect();
      const P=posOf({x:clamp((e.clientX-r.left)/r.width*100,5,95),y:clamp((e.clientY-r.top)/r.height*100,4,96)});
      html+=`<span class="gp" style="background:${POSCOL[P.cat]}">→ ${P.code}</span>`;
    }else if(t&&t.kind==='sub'&&!samePlace(t,drag.src)) html+=`<span class="gp" style="background:#fff">→ 후보</span>`;
    if(drag.ghost.innerHTML!==html) drag.ghost.innerHTML=html;
  }
  const tel=t&&t.el&&!samePlace(t,drag.src)?t.el:null;
  if(drag.over!==tel){if(drag.over)drag.over.classList.remove('over');if(tel)tel.classList.add('over');drag.over=tel}
}
function cleanup(){
  document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);document.removeEventListener('pointercancel',cleanup);
  if(drag){if(drag.ghost)drag.ghost.remove();if(drag.over)drag.over.classList.remove('over');drag.el.classList.remove('dragging')}
  drag=null;
}
function onUp(e){
  if(!drag) return;
  const d=drag;cleanup();
  if(!d.moved){tap(d.src);return}
  const t=targetAt(e.clientX,e.clientY);if(!t) return;
  const src=d.src;
  if(src.kind==='bench'){if(isPlace(t)) assignTo(t,src.pid); else return}
  else{
    if(isPlace(t)&&!samePlace(t,src)) swapP(src,t);
    else if(t.kind==='bench') unassign(src);
    else if(src.kind==='slot'){
      const r=$('#pitch').getBoundingClientRect();const s=T().slots[src.idx];
      s.x=clamp((e.clientX-r.left)/r.width*100,5,95);s.y=clamp((e.clientY-r.top)/r.height*100,4,96);
    }else return;
  }
  sel=null;commit();
}

function addNamesFrom(input,attend){
  const names=input.value.split(/[,\n\t·/]+/).map(s=>s.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean);
  if(!names.length) return;
  input.value='';

}
function addNameList(names,attend=true){
  if(!groupId) return;
  const byName=playersByName();
  let registered=0,added=0;
  for(const n of names){
    const nm=n.slice(0,20);let id=byName.get(nm);
    if(!id){
      id=uid();
      roster[id]={name:nm,createdAt:Date.now(),groupId};
      byName.set(nm,id);
      if(mode==='db') putPlayer(id);
      registered++;
    }
    if(attend&&!cur.attendees.includes(id)){cur.attendees.push(id);added++}
  }
  commit();
  if(attend) toast(added?`${added}명을 오늘 참가자에 추가했어요`:'이미 오늘 명단에 있어요');
  else toast(registered?`모임에 ${registered}명을 등록했어요`:'이미 모임 명단에 있어요');
}

$('#splitRandom').addEventListener('click',()=>{
  const att=cur.attendees.filter(id=>roster[id]);
  if(!att.length){toast('먼저 참가자를 추가하세요');return}
  const doIt=()=>{
    const ks=keys();
    for(const k of ks){for(const s of cur.teams[k].slots)s.pid=null;cur.teams[k].subs=[]}
    const order=sl=>[...sl.slice(1),sl[0]];
    const qs=ks.map(k=>order(cur.teams[k].slots));let turn=0;
    for(const p of shuffle(att)){let tries=0;while(tries<qs.length&&!qs[turn%qs.length].length){turn++;tries++}
      const q=qs[turn%qs.length];
      if(!q.length){subsOf(cur.teams[ks[turn%ks.length]]).push(p);turn++;continue}
      q.shift().pid=p;turn++}
    sel=null;commit();toast(ks.length>1?`${ks.length}팀으로 랜덤 배정했어요`:'랜덤으로 채웠어요');
  };
  if(keys().some(k=>cur.teams[k].slots.some(sl=>sl.pid)||subsOf(cur.teams[k]).length)) confirmBox('랜덤 나누기','지금 배치된 선수를 모두 빼고 새로 나눌까요?','나누기',doIt); else doIt();
});

});
function lineupText(){
  const out=[];if(cur.title&&cur.title.trim()) out.push(cur.title.trim(),'');
  for(const k of keys()){
    const tm=cur.teams[k];out.push(`[${tm.name}] ${cur.size}인 ${fname(tm)}`);
    for(const lb of ['GK','DF','MF','FW']){const ns=tm.slots.filter(s=>s.pid&&posOf(s).cat===lb).sort((a,b)=>a.x-b.x).map(s=>lb==='GK'?pname(s.pid):`${pname(s.pid)}(${posOf(s).code})`);if(ns.length) out.push(`${lb}: ${ns.join(', ')}`)}
    if(subsOf(tm).length) out.push(`SUB: ${subsOf(tm).map(pname).join(', ')}`);
    const empty=tm.slots.filter(s=>!s.pid).length;if(empty) out.push(`(빈자리 ${empty})`);out.push('');
  }
  if(cur.referee) out.push(`심판: ${cur.referee}`);
  const b=bench();if(b.length) out.push(`대기: ${b.map(pname).join(', ')}`);
  return out.join('\n').trim();
}

function fname(t){return FORMATIONS[cur.size].includes(t.formation)?t.formation:'직접 배치'}
function resizeTeam(t,n){
  const sl=t.slots;let out=0;
  if(n>sl.length){
    const cand=buildSlots(FORMATIONS[n][0]).slice(1);
    const d=(a,b)=>Math.hypot(a.x-b.x,(a.y-b.y)*1.4);
    while(sl.length<n&&cand.length){
      let bi=0,bd=-1;cand.forEach((c,i)=>{const m=Math.min(...sl.map(s=>d(s,c)));if(m>bd){bd=m;bi=i}});
      const c=cand.splice(bi,1)[0];sl.push({x:c.x,y:c.y,label:c.label,pid:null});
    }
  }else{
    while(sl.length>n){
      let i=-1;for(let j=sl.length-1;j>=1;j--)if(!sl[j].pid){i=j;break}
      if(i<0){i=sl.length-1;if(sl[i].pid)out++}
      sl.splice(i,1);
    }
  }
  t.formation='custom';return out;
}
$('#sizeSel').addEventListener('change',e=>{

});

const SHOT_PROMPT=`이 이미지는 카카오톡 단톡방의 투표 화면 캡처예요(투표 현황/참여자 목록일 수 있어요). 동네 축구 참석 인원을 정리하려고 해요.
투표 항목별로 그 항목에 투표한 사람의 이름(프로필 이름)을 화면에 보이는 그대로 뽑아 주세요.
- 이름이 보이지 않고 숫자(득표수)만 있는 항목은 names를 빈 배열로 두세요.
- '나', '투표하기', 시간, 득표수 같은 UI 글자는 이름이 아니에요.
- 이름 옆 이모지나 괄호 속 메모는 빼도 돼요. 이름을 지어내지 마세요.
- 여러 장이면 같은 항목끼리 합치고 같은 이름은 한 번만 넣으세요.
JSON만 답하세요. 형식: {"title":"투표 제목 또는 빈 문자열","options":[{"label":"참석","names":["홍길동","김철수"]}]}
투표 화면이 아니면 {"title":"","options":[]} 로 답하세요.`;
async function readShots(files){
  const sourceGroup=groupId;
  const lim=await SAMPLE.limits().catch(()=>null);
  if(sourceGroup!==groupId||view!=='lineup') return;
  const max=lim&&lim.images?lim.images.maxCount:4;
  if(files.length>max){toast(`한 번에 ${max}장까지 읽을 수 있어요`);files=files.slice(0,max)}
  const ctl=new AbortController();
  openModal('캡처 읽는 중','<div class="spin"></div><p style="text-align:center">투표 명단을 읽고 있어요. 10~30초쯤 걸려요.</p>',[{label:'취소',fn:()=>ctl.abort()}]);
  let res;
  try{res=await SAMPLE.json(SHOT_PROMPT,{images:files,signal:ctl.signal})}
  catch(e){
    if(e.code==='cancelled'||sourceGroup!==groupId||view!=='lineup') return;
    closeModal();
    const msg={not_granted:'Claude 사용을 허용해야 캡처를 읽을 수 있어요',image_rejected:'이 이미지는 읽을 수 없어요. 다른 캡처로 시도해 주세요',rate_limited:'요청이 많아요. 잠시 후 다시 시도해 주세요',invalid_json:'명단을 읽지 못했어요. 다시 시도해 주세요',images_unavailable:'이 화면에서는 이미지를 보낼 수 없어요'}[e.code]||'캡처를 읽지 못했어요. 다시 시도해 주세요';
    if(['not_granted','sampling_disabled','images_unavailable','not_declared','capability_disabled','capability_removed'].includes(e.code)){SAMPLE=null;$('#shotBtn').classList.add('hidden')}
    toast(msg);return;
  }
  if(sourceGroup!==groupId||view!=='lineup') return;
  const opts=(res&&Array.isArray(res.options)?res.options:[]).map(o=>({label:String(o&&o.label||'항목').slice(0,30),names:[...new Set((Array.isArray(o&&o.names)?o.names:[]).map(n=>String(n).trim().slice(0,20)).filter(Boolean))]}));
  if(!opts.some(o=>o.names.length)){
    closeModal();
    openModal('이름을 찾지 못했어요','<p>투표 결과에서 <b>투표한 사람 목록</b>(투표 현황)을 연 상태로 캡처해 주세요. 득표수만 보이는 화면에서는 이름을 알 수 없어요.</p>',[{label:'확인',primary:true}]);
    return;
  }
  showShotResult(opts,res.title);
}
function showShotResult(opts,title){
  const yes=/참석|참가|가능|ㅇㅇ|갑니다|가요|콜|yes|o\b/i;
  let oi=Math.max(0,opts.findIndex(o=>o.names.length&&yes.test(o.label)));
  if(!opts[oi].names.length) oi=opts.findIndex(o=>o.names.length);
  const byName=playersByName();
  const att=new Set(cur.attendees);
  let picked=new Set();
  const reset=()=>{picked=new Set(opts[oi].names.filter(n=>!att.has(byName.get(n))))};
  reset();
  const body=()=>`${title?`<p style="margin-bottom:10px"><b style="color:var(--ink)">${esc(title)}</b></p>`:''}
    <div class="pick-label">투표 항목</div>
    <div class="picks">${opts.map((o,i)=>`<button class="pick ${i===oi?'on':''}" data-oi="${i}">${esc(o.label)}<span class="opt-cnt">${o.names.length}</span></button>`).join('')}</div>
    <div class="pick-label">추가할 사람 (눌러서 빼거나 넣기)</div>
    <div class="picks">${opts[oi].names.length?opts[oi].names.map(n=>{const id=byName.get(n);const inToday=id&&att.has(id);
      return `<button class="pick ${picked.has(n)?'on':''} ${id&&!inToday?'exist':''}" data-nm="${esc(n)}" ${inToday?'disabled title="이미 오늘 명단에 있어요"':''}>${esc(n)}</button>`}).join(''):'<span class="empty">이 항목은 이름이 보이지 않아요.</span>'}</div>
    <p class="sub" style="margin:-6px 0 8px">이름이 잘못 읽혔으면 추가한 뒤 선수 기록 탭에서 바꾸거나, 빼고 직접 입력하세요. "기존"은 지난 기록이 있는 선수예요.</p>`;
  closeModal();
  openModal('투표 명단',body(),[{label:'취소'},{label:'추가',primary:true,fn:()=>{
    const list=opts[oi].names.filter(n=>picked.has(n));
    if(!list.length){toast('추가할 사람을 골라 주세요');return false}
    addNameList(list);toast(`${list.length}명을 오늘 참가자로 추가했어요`);
  }}]);
  const upd=()=>{$('#mBody').innerHTML=body();const b=$('#mActions .primary');if(b)b.textContent=picked.size?`${picked.size}명 추가`:'추가'};
  upd();
  modalClick=e=>{
    const o=e.target.closest('[data-oi]');if(o){oi=+o.dataset.oi;reset();upd();return}
    const n=e.target.closest('[data-nm]');if(n&&!n.disabled){const v=n.dataset.nm;picked.has(v)?picked.delete(v):picked.add(v);upd()}
  };
}

async function shareFile(blob,name,text){try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'스쿼드 메이커',text});return true}}catch(e){if(e&&e.name==='AbortError')return true}return false}
async function initDownloads(){try{if(window.claude&&typeof window.claude.use==='function')DL=await window.claude.use('downloads')}catch(e){DL=null}}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function fitText(ctx,t,max){if(ctx.measureText(t).width<=max)return t;while(t.length>1&&ctx.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…'}
const FONT="'Noto Sans KR',system-ui,sans-serif";
function drawTeam(k){
  const t=cur.teams[k];const W=900,PW=600,PH=Math.round(PW*105/68),HEAD=120,PAD=24,H=HEAD+PH+PAD*2+10;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#f3f1ea';x.fillRect(0,0,W,H);
  // header
  x.fillStyle=t.color;rr(x,PAD,PAD,10,64,5);x.fill();
  x.fillStyle='#1c1e1b';x.font=`900 38px ${FONT}`;x.textBaseline='alphabetic';x.fillText(fitText(x,t.name,520),PAD+26,PAD+40);
  x.fillStyle='#6c7069';x.font=`700 20px ${FONT}`;
  const sub=[`${cur.size}인 ${fname(t)}`,cur.title||'',fmtDate(today())].filter(Boolean).join(' · ');
  x.fillText(fitText(x,sub,560),PAD+26,PAD+72);
  // pitch
  const px=PAD,py=HEAD;
  x.save();rr(x,px,py,PW,PH,18);x.clip();
  for(let i=0;i<12;i++){x.fillStyle=i%2?'#2a8447':'#2f8f4e';x.fillRect(px,py+i*PH/12,PW,PH/12+1)}
  const sx=PW/68,sy=PH/105;x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=2.5;
  const R=(a,b,w,h)=>x.strokeRect(px+a*sx,py+b*sy,w*sx,h*sy);
  R(2,2,64,101);x.beginPath();x.moveTo(px+2*sx,py+52.5*sy);x.lineTo(px+66*sx,py+52.5*sy);x.stroke();
  x.beginPath();x.arc(px+34*sx,py+52.5*sy,9.15*sx,0,Math.PI*2);x.stroke();
  R(13.85,2,40.3,16.5);R(24.84,2,18.32,5.5);R(13.85,86.5,40.3,16.5);R(24.84,97.5,18.32,5.5);
  x.restore();
  for(const s of t.slots){
    const cx=px+s.x/100*PW,cy=py+s.y/100*PH,P=posOf(s),col=POSCOL[P.cat],r=30;
    x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);
    if(s.pid){x.fillStyle=col;x.fill();x.lineWidth=3;x.strokeStyle='#fff';x.beginPath();x.arc(cx,cy,r-5,0,Math.PI*2);x.stroke();x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.lineWidth=4;x.strokeStyle=col;x.stroke();x.fillStyle=textOn(col)}
    else{x.fillStyle='rgba(10,20,14,.35)';x.fill();x.setLineDash([7,5]);x.lineWidth=3;x.strokeStyle=col;x.stroke();x.setLineDash([]);x.fillStyle=col}
    x.font=`900 ${P.code.length>3?13:15}px ${FONT}`;x.textAlign='center';x.textBaseline='middle';x.fillText(P.code,cx,cy+1);
    if(s.pid){
      x.font=`700 19px ${FONT}`;const nm=fitText(x,pname(s.pid),130);const tw=x.measureText(nm).width+20;
      x.fillStyle='rgba(0,0,0,.68)';rr(x,cx-tw/2,cy+r+6,tw,30,7);x.fill();
      x.fillStyle=t.color;x.fillRect(cx-tw/2+4,cy+r+32,tw-8,3);
      x.fillStyle='#fff';x.fillText(nm,cx,cy+r+21);
    }
    x.textAlign='left';x.textBaseline='alphabetic';
  }
  // right column
  const cx0=px+PW+20,cw=W-cx0-PAD;let cy0=py;
  if(cur.referee){
    x.fillStyle='#1c1e1b';rr(x,cx0,cy0,cw,86,14);x.fill();
    x.fillStyle='#ffd84d';x.beginPath();x.arc(cx0+26,cy0+28,13,0,Math.PI*2);x.fill();
    x.fillStyle='#1c1e1b';x.font=`900 14px ${FONT}`;x.textAlign='center';x.fillText('심',cx0+26,cy0+33);x.textAlign='left';
    x.fillStyle='rgba(255,255,255,.75)';x.font=`700 17px ${FONT}`;x.fillText('심판',cx0+48,cy0+34);
    x.fillStyle='#fff';x.font=`900 22px ${FONT}`;x.fillText(fitText(x,cur.referee,cw-30),cx0+16,cy0+70);
    cy0+=100;
  }
  const subs=subsOf(t);
  const sh=56+Math.max(1,subs.length)*44;
  x.fillStyle='#1f2a22';rr(x,cx0,cy0,cw,sh,14);x.fill();
  x.fillStyle='rgba(255,255,255,.8)';x.font=`900 18px ${FONT}`;x.fillText(`후보 ${subs.length}`,cx0+16,cy0+34);
  if(!subs.length){x.fillStyle='rgba(255,255,255,.45)';x.font=`500 16px ${FONT}`;x.fillText('없음',cx0+16,cy0+76)}
  subs.forEach((p,i)=>{const y=cy0+50+i*44;x.fillStyle='rgba(255,255,255,.09)';rr(x,cx0+10,y,cw-20,36,8);x.fill();x.fillStyle=t.color;x.fillRect(cx0+10,y+4,4,28);
    x.fillStyle='#fff';x.font=`700 17px ${FONT}`;x.fillText(fitText(x,pname(p),cw-50),cx0+24,y+24)});
  // legend
  let ly=Math.max(cy0+sh+24,py+PH-130);
  [['FW','공격'],['MF','미드필더'],['DF','수비'],['GK','골키퍼']].forEach(([k2,l],i)=>{const y=ly+i*30;x.beginPath();x.arc(cx0+14,y,9,0,Math.PI*2);x.fillStyle=POSCOL[k2];x.fill();
    x.fillStyle='#6c7069';x.font=`700 16px ${FONT}`;x.fillText(l,cx0+32,y+6)});
  x.fillStyle='#a5a194';x.font=`500 14px ${FONT}`;x.fillText('스쿼드 메이커',cx0,py+PH-4);
  return c;
}
function drawAll(){
  const cs=keys().map(drawTeam);const cols=cs.length>1?2:1,rows=Math.ceil(cs.length/cols);
  const w=cs[0].width,h=cs[0].height,g=0;
  const c=document.createElement('canvas');c.width=w*cols;c.height=h*rows;const x=c.getContext('2d');x.fillStyle='#f3f1ea';x.fillRect(0,0,c.width,c.height);
  cs.forEach((cv,i)=>x.drawImage(cv,(i%cols)*w,Math.floor(i/cols)*h));
  if(cols>1){x.strokeStyle='#e3e0d6';x.lineWidth=2;for(let i=1;i<cols;i++){x.beginPath();x.moveTo(i*w,20);x.lineTo(i*w,c.height-20);x.stroke()}}
  return c;
}
async function openImage(){
  try{await document.fonts.ready}catch(e){}
  let mode=cur.teamCount>1?'all':'one';
  const make=()=>{const c=mode==='all'?drawAll():drawTeam(cur.active);return c};
  let canvas=make();
  const body=()=>`${cur.teamCount>1?`<div class="picks" style="margin-bottom:10px"><button class="pick ${mode==='one'?'on':''}" data-im="one">${esc(T().name)}만</button><button class="pick ${mode==='all'?'on':''}" data-im="all">전체 ${cur.teamCount}팀</button></div>`:''}
    <img class="img-prev" id="imgPrev" src="${canvas.toDataURL('image/png')}" alt="스쿼드 이미지">
    <p class="sub" style="margin:0 0 6px">저장이 안 되면 이미지를 길게 눌러 저장하세요.</p>`;
  const blob=()=>new Promise(r=>canvas.toBlob(r,'image/png'));
  const fn=()=>{const t=mode==='all'?'전체':T().name;return `스쿼드_${t}_${today()}.png`.replace(/[\\/:*?"<>|\s]+/g,'_')};
  const acts=[{label:'닫기'}];
  if(navigator.canShare)acts.push({label:'카톡 등으로 공유',fn:()=>{blob().then(b=>shareFile(b,fn(),'오늘 스쿼드')).then(ok=>{if(!ok)toast('이 기기에서는 공유가 안 돼요. 저장 후 보내 주세요')});return false}});
  if(navigator.clipboard&&window.ClipboardItem)acts.push({label:'이미지 복사',fn:()=>{
    try{navigator.clipboard.write([new ClipboardItem({'image/png':blob()})]).then(()=>toast('이미지를 복사했어요 · 단톡방에 붙여넣으세요'),()=>toast('이 화면에서는 복사가 안 돼요. 저장해서 보내 주세요'))}catch(e){toast('이 화면에서는 복사가 안 돼요')}
    return false}});
  if(!DL)acts.push({label:'이미지 저장',primary:true,fn:()=>{blob().then(b=>{saveBlobFile(b,fn());toast('이미지를 저장했어요')});return false}});
  if(DL)acts.push({label:'이미지 저장',primary:true,fn:()=>{
    blob().then(b=>DL.save({filename:fn(),data:b})).then(()=>toast('이미지를 저장했어요'),e=>{
      const c=e&&e.code;if(c==='declined')return;
      if(['unavailable','not_granted','capability_disabled','capability_removed'].includes(c)){DL=null;toast('이 화면에서는 저장할 수 없어요. 이미지를 길게 눌러 저장하세요')}
      else if(c==='rate_limited')toast('잠시 후 다시 눌러 주세요');else toast('저장하지 못했어요')});
    return false}});
  openModal('스쿼드 이미지',body(),acts);
  modalClick=e=>{const b=e.target.closest('[data-im]');if(!b)return;mode=b.dataset.im;canvas=make();$('#mBody').innerHTML=body()};
}
$('#saveImg').addEventListener('click',openImage);

/* ================= 앱 설치 · 백업 ================= */
let deferredPrompt=null;
const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!standalone())$('#installBtn').classList.remove('hidden')});
window.addEventListener('appinstalled',()=>{$('#installBtn').classList.add('hidden');toast('앱을 설치했어요')});
if(isIOS&&!standalone())$('#installBtn').classList.remove('hidden');
$('#installBtn').addEventListener('click',async()=>{
  if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;$('#installBtn').classList.add('hidden');return}
  openModal('홈 화면에 앱 추가',isIOS?'<p>1. 사파리 아래쪽 <b>공유 버튼</b>(네모에 위 화살표)을 누르세요.<br>2. <b>홈 화면에 추가</b>를 누르세요.<br>3. 홈 화면의 스쿼드 메이커 아이콘으로 열면 앱처럼 써요.</p><p>카톡 안에서 열었다면 오른쪽 아래 메뉴에서 <b>Safari로 열기</b>를 먼저 눌러 주세요.</p>'
    :'<p>브라우저 메뉴(⋮)에서 <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르세요.</p><p>카톡 안에서 열었다면 오른쪽 위 메뉴에서 <b>다른 브라우저로 열기</b>를 먼저 눌러 주세요.</p>',[{label:'확인',primary:true}]);
});
$('#backupOut').addEventListener('click',async()=>{
  const data=JSON.stringify({app:'squadmaker',v:3,savedAt:new Date().toISOString(),roster,matches,cur:currentData()},null,1);
  const blob=new Blob([data],{type:'application/json'});const name=`스쿼드메이커_백업_${today()}.json`;
  if(!(await shareFile(blob,name,'스쿼드 메이커 백업')))saveBlobFile(blob,name);
});
$('#backupIn').addEventListener('click',()=>$('#backupFile').click());
$('#backupFile').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  f.text().then(t=>{let d;try{d=JSON.parse(t)}catch(err){toast('백업 파일을 읽을 수 없어요');return}
    if(!d||d.app!=='squadmaker'||!d.roster||!d.matches){toast('스쿼드 메이커 백업 파일이 아니에요');return}
    const n=Object.keys(d.matches).length,pn=Object.keys(d.roster).length;
    confirmBox('백업 불러오기',`선수 ${pn}명, 경기 ${n}개가 들어 있어요. 지금 이 폰의 기록을 백업 내용으로 바꿀까요?`,'불러오기',()=>{
       roster=d.roster;matches=d.matches;restoreGroups(d.cur);saveLocal();showGroups();toast('백업을 불러왔어요')},true);
  });
});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ================= boot ================= */
function normalizeCur(c){
  if(!c||!c.teams||!c.teams.A) return freshCurrent();
  const draft=clone(c);
  if(!FORMATIONS[draft.size]) draft.size=11;
  if(!Array.isArray(draft.attendees)) draft.attendees=[];
  if(!Number.isInteger(draft.teamCount)||draft.teamCount<1||draft.teamCount>MAXT) draft.teamCount=2;
  ensureTeams(draft);
  return draft;
}
function restoreGroups(data){
  if(data?.v===3&&data.groups&&typeof data.groups==='object'&&!Array.isArray(data.groups)){
    groups=Object.fromEntries(Object.entries(data.groups).map(([id,record])=>[id,normalizeCur(record)]));
  }else{
    groups={};
    if(data?.started||Object.keys(roster).length||Object.keys(matches).length){
      const draft=normalizeCur(data);
      draft.title=String(draft.title||'').trim()||'기존 모임';
      groups[LEGACY_GROUP]=draft;
    }
  }
  if(groupId&&Object.hasOwn(groups,groupId)) cur=groups[groupId];
  else{activateGroup(null);view='groups'}
}
function finishLoad(){
  if(loaded) return;loaded=true;
  $('#loading').classList.add('hidden');showBanner();renderAll();
}
function mergeCollection(snap,prefix,local){
  const out={};
  for(const d of snap.docs){if(pend.has(prefix+d.id))continue;out[d.id]=clone(d.data())}
  for(const k in local){if(pend.has(prefix+k)&&!(k in out))out[k]=local[k]}
  // pending deletes: drop them
  for(const k in out){if(pend.has(prefix+k)&&!(k in local))delete out[k]}
  return out;
}
async function boot(){
  renderAll();
  let db=null;
  try{if(window.claude&&typeof window.claude.use==='function') db=await window.claude.use('db')}catch(e){db=null}
  if(!db){mode='local';loadLocal();finishLoad();return}
  DB=db;mode='db';
  try{const u=await window.claude.use('user');if(u&&typeof u.can==='function'){const c=await u.can('data.write');if(c===false)readOnly=true}}catch(e){}
  const got={p:false,m:false,c:false};
  let snapshot=null;
  const finish=()=>{if(!loaded){restoreGroups(snapshot);finishLoad()}};
  const timer=setTimeout(()=>{if(!loaded){toast('기록을 아직 불러오지 못했어요. 연결을 확인해 주세요');finish()}},10000);
  const check=()=>{if(got.p&&got.m&&got.c){clearTimeout(timer);finish()}};
  const onErr=e=>{if(e&&e.code==='revoked'){readOnly=true;showBanner();if(loaded)renderAll()}clearTimeout(timer);finish()};
  DB.collection('players').onSnapshot(s=>{roster=mergeCollection(s,'players/',roster);got.p=true;if(loaded&&!drag)renderAll();check()},onErr);
  DB.collection('matches').onSnapshot(s=>{matches=mergeCollection(s,'matches/',matches);got.m=true;if(loaded&&!drag&&!isTyping())renderAll();check()},onErr);
  DB.doc('app/current').onSnapshot(d=>{
    dbCurrentLoaded=true;
    if(!pend.has('app/current')&&!drag){
      snapshot=d.exists?d.data():null;
      if(loaded){
        restoreGroups(snapshot);
        if(sel&&sel.kind==='slot'&&!T().slots[sel.idx])sel=null;
        if(!isTyping()) renderAll();
      }
    }
    got.c=true;check();
  },onErr);
}
function isTyping(){const a=document.activeElement;return a&&(a.id==='mdTitle'||a.id==='mdRef'||a.id==='rnIn'||a.id==='refIn')}
boot();
initSample();
initDownloads();
})();
